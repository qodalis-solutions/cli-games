name: Deploy CLI Games

on:
  push:
    branches:
      - main
  # Re-run a release by hand (Actions > Deploy > Run workflow on main); publishing and the release skip what exists
  workflow_dispatch:

jobs:
  deploy:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: https://registry.npmjs.org/

      - name: Release notes in CHANGELOG.md
        run: node tools/release-notes.js --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject versions
        run: node tools/inject-versions.js

      - name: Build
        run: pnpm run build

      - name: Check build output
        run: node tools/check-dist.js

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          FAILED=()
          for DIR in packages/*/; do
            NAME=$(node -p "require('./$DIR/package.json').name")
            echo "Publishing $NAME..."
            OUTPUT=$(cd "$DIR" && npm publish --access public 2>&1) && true
            EXIT_CODE=$?
            if [ $EXIT_CODE -ne 0 ]; then
              if echo "$OUTPUT" | grep -q "You cannot publish over the previously published versions"; then
                echo "$NAME version already exists on npm, skipping."
              else
                echo "$OUTPUT"
                echo "::error::Failed to publish $NAME"
                FAILED+=("$NAME")
              fi
            fi
          done
          if [ ${#FAILED[@]} -ne 0 ]; then
            echo "::error::Failed to publish: ${FAILED[*]}"
            exit 1
          fi

  release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/2048/package.json').version")
          TAG="v$VERSION"
          # Pushes to main that do not change the version (docs-only releases) keep the existing release
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          PREVIOUS=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          node tools/release-notes.js "$VERSION" ${PREVIOUS:+--previous=$PREVIOUS} > release-notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest
